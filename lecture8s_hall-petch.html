<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall–Petch: Grain Size and Strength (Lecture 8s)</title>
<style>
  :root{--navy:#1F3864;--terra:#B85042;--teal:#1F7A63;--amber:#E8890C;--purp:#6D4C7D;--steel:#2E5496;--slate:#3F4A5A;--mut:#6B7480;--line:#C7CFDA;--ice:#D9E1F2;--light:#F1F4F8;--bg:#FFFFFF;--green:#2C6E49;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--slate);font-family:Calibri,'Segoe UI',system-ui,sans-serif;line-height:1.45;}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 20px 40px;}
  h1{font-family:Cambria,Georgia,serif;color:var(--navy);font-size:25px;margin:2px 0 2px;}
  .sub{color:var(--mut);font-size:15px;margin:0 0 14px;}
  .stage{background:var(--light);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:18px;flex-wrap:wrap;}
  .canvaswrap{flex:1 1 500px;min-width:320px;}
  canvas{width:100%;height:auto;display:block;border-radius:8px;background:#fff;}
  .panel{flex:1 1 355px;min-width:305px;display:flex;flex-direction:column;}
  .step{font-size:12.5px;font-weight:bold;letter-spacing:1px;color:var(--purp);text-transform:uppercase;margin-bottom:4px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 17px;flex:1;}
  .card h3{margin:0 0 8px;font-family:Cambria,serif;font-size:18px;color:var(--navy);}
  .card p{font-size:14.5px;margin:0 0 10px;}
  .eq{font-family:Cambria,serif;font-size:18px;color:var(--navy);background:var(--light);border-radius:6px;padding:9px 13px;display:block;margin:2px 0 10px;font-weight:bold;text-align:center;}
  .defs{margin:4px 0 10px;padding:0;list-style:none;}
  .defs li{font-size:13.8px;color:var(--slate);margin:5px 0;line-height:1.5;padding-left:15px;position:relative;}
  .defs li::before{content:"•";position:absolute;left:2px;color:var(--purp);}
  .defs b{color:var(--navy);font-family:Cambria,serif;}
  table.dh{border-collapse:collapse;margin:6px 0 10px;font-size:13.5px;width:100%;}
  table.dh th,table.dh td{border:1px solid var(--line);padding:5px 8px;text-align:center;}
  table.dh th{background:var(--light);color:var(--navy);font-family:Cambria;font-weight:bold;}
  .answer-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  input[type=number]{font-family:Cambria;font-size:17px;width:110px;padding:7px 9px;border:1.5px solid var(--line);border-radius:6px;}
  .unit{color:var(--slate);font-size:15px;font-family:Cambria,serif;}
  button{font-family:Calibri;font-size:14.5px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;}
  button.ghost{background:#fff;color:var(--navy);}
  button:disabled{opacity:.4;cursor:default;}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:13px;}
  .feedback{margin-top:11px;font-size:13.5px;line-height:1.55;border-radius:8px;padding:10px 13px;display:none;}
  .feedback.ok{display:block;background:#E8F3EC;border:1px solid var(--green);color:#1c4c31;}
  .feedback.no{display:block;background:#FBECE9;border:1px solid var(--terra);color:#7a2e22;}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:12px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dot.on{background:var(--navy);}
  .legend{font-size:13px;color:var(--mut);margin-top:8px;}
  .solution{margin-top:9px;font-size:13.5px;background:var(--light);border-left:3px solid var(--steel);padding:9px 12px;border-radius:6px;color:var(--slate);line-height:1.55;}
  .solution b{color:var(--navy);}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
  b.term{color:var(--navy);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hall–Petch: finer grains, stronger metal</h1>
  <p class="sub">Grain boundaries block dislocations, so shrinking the grains raises the yield strength. Fit the line from two measurements, then predict a third.</p>

  <div class="stage">
    <div class="canvaswrap">
      <canvas id="cv" width="720" height="440" role="img" aria-label="Illustration of coarse versus fine grains"></canvas>
      <div class="legend" id="capt" aria-live="polite">Yield strength rises linearly with d<sup>−1/2</sup> (the inverse square root of grain size).</div>
    </div>
    <div class="panel">
      <div class="step" id="stepLabel">Step 1 of 7</div>
      <div class="card" id="card"></div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const CSS={navy:'#1F3864',terra:'#B85042',teal:'#1F7A63',amber:'#E8890C',purp:'#6D4C7D',steel:'#2E5496',slate:'#3F4A5A',mut:'#6B7480',line:'#C7CFDA',light:'#F1F4F8',green:'#2C6E49'};

// data: (d^-1/2 , sigma_y)
const A=[5,150], B=[10,200];       // coarse, fine
const KY=10, S0=100;                // slope, intercept
const PRED_X=20, PRED_S=300;       // d=0.0025mm -> d^-1/2=20 -> 300 MPa

// ---- module-level state (persists across re-renders) ----
let stage=0;
let answers={K:'',S:'',X:'',P:''};
let feedback={K:null,S:null,X:null,P:null};
let attempts={K:0,S:0,X:0,P:0};
let revealed={K:false,S:false,X:false,P:false};
let solved={K:false,S:false,X:false,P:false};
const solText={
 K:'k<sub>y</sub> = Δσ<sub>y</sub> / Δ(d<sup>−1/2</sup>) = (200 − 150) / (10 − 5) = 50/5 = <b>10 MPa·mm<sup>1/2</sup></b>.',
 S:'σ<sub>0</sub> = σ<sub>y</sub> − k<sub>y</sub>·d<sup>−1/2</sup> = 150 − (10)(5) = 150 − 50 = <b>100 MPa</b>.',
 X:'d<sup>−1/2</sup> = 1/&radic;d = 1/&radic;0.0025 = 1/0.05 = <b>20 mm<sup>−1/2</sup></b>.',
 P:'σ<sub>y</sub> = σ<sub>0</sub> + k<sub>y</sub>·d<sup>−1/2</sup> = 100 + (10)(20) = <b>300 MPa</b>.'
};
const stageKey=st=>({2:'K',3:'S',4:'X',5:'P'})[st]||null;

const stages=[
 {html:`<h3>Why small grains strengthen a metal</h3>
   <p>Metals deform when line defects called <b>dislocations</b> glide through the crystal. A <b>grain boundary</b> — where two crystal orientations meet — stops a dislocation in its tracks.</p>
   <ul class="defs"><li>More boundaries (smaller grains) means dislocations are blocked sooner, so the metal is <b>stronger</b>. The picture shows coarse vs. fine grains.</li></ul>
   <p>The <b>Hall–Petch</b> relation makes this quantitative.</p>`},
 {html:`<h3>The Hall–Petch model</h3>
   <div class="eq">σ<sub>y</sub> = σ<sub>0</sub> + k<sub>y</sub> · d<sup>−1/2</sup></div>
   <ul class="defs">
     <li><b>σ<sub>y</sub></b> — yield strength (MPa), the stress where the metal starts to deform permanently</li>
     <li><b>d</b> — average grain diameter (mm)</li>
     <li><b>d<sup>−1/2</sup></b> — one over the square root of d; plotting against <b>this</b> makes the relationship a straight line</li>
     <li><b>k<sub>y</sub></b> — strengthening coefficient: the <b>slope</b> of that line (MPa·mm<sup>1/2</sup>)</li>
     <li><b>σ<sub>0</sub></b> — friction stress: the <b>intercept</b> (strength if grains were infinitely large), MPa</li>
   </ul>
   <table class="dh"><tr><th>grains</th><th>d (mm)</th><th>d<sup>−1/2</sup></th><th>σ<sub>y</sub> (MPa)</th></tr>
     <tr><td>coarse</td><td>0.04</td><td>5</td><td>150</td></tr>
     <tr><td>fine</td><td>0.01</td><td>10</td><td>200</td></tr></table>
   <p>These two points are plotted at left. σ<sub>0</sub> and k<sub>y</sub> are material constants we'll extract.</p>`},
 {html:`<h3>Find k<sub>y</sub> — the slope</h3>
   <p>The slope is the rise in σ<sub>y</sub> divided by the run in d<sup>−1/2</sup> between the two points (drawn at left).</p>
   <div class="eq">k<sub>y</sub> = Δσ<sub>y</sub> / Δ(d<sup>−1/2</sup>) = (200 − 150) / (10 − 5)</div>
   <label class="sr-only" for="ansK">Slope k_y, in megapascals times square-root millimeters</label>
   <div class="answer-row"><span class="unit">k<sub>y</sub> =</span><input type="number" id="ansK" step="1" placeholder="?"> <span class="unit">MPa·mm<sup>1/2</sup></span><button id="checkK">Check</button></div>
   <div class="feedback" id="fbK" aria-live="polite"></div>
   <div id="hintK"></div>`},
 {html:`<h3>Find σ<sub>0</sub> — the intercept</h3>
   <p>Rearrange the model and plug in either point (use the coarse one: d<sup>−1/2</sup> = 5, σ<sub>y</sub> = 150).</p>
   <div class="eq">σ<sub>0</sub> = σ<sub>y</sub> − k<sub>y</sub> · d<sup>−1/2</sup> = 150 − (10)(5)</div>
   <label class="sr-only" for="ansS">Intercept sigma_0, in megapascals</label>
   <div class="answer-row"><span class="unit">σ<sub>0</sub> =</span><input type="number" id="ansS" step="1" placeholder="?"> <span class="unit">MPa</span><button id="checkS">Check</button></div>
   <div class="feedback" id="fbS" aria-live="polite"></div>
   <div id="hintS"></div>`},
 {html:`<h3>Predict, part 1 — convert the new grain size</h3>
   <p>A new sample is processed to a finer grain size <b>d = 0.0025 mm</b>. First turn that into d<sup>−1/2</sup>.</p>
   <div class="eq">d<sup>−1/2</sup> = 1 / √d = 1 / √0.0025</div>
   <ul class="defs"><li>√0.0025 = 0.05 mm<sup>1/2</sup>, so take one over that.</li></ul>
   <label class="sr-only" for="ansX">d to the minus one half, in inverse square-root millimeters</label>
   <div class="answer-row"><span class="unit">d<sup>−1/2</sup> =</span><input type="number" id="ansX" step="1" placeholder="?"> <span class="unit">mm<sup>−1/2</sup></span><button id="checkX">Check</button></div>
   <div class="feedback" id="fbX" aria-live="polite"></div>
   <div id="hintX"></div>`},
 {html:`<h3>Predict, part 2 — the yield strength</h3>
   <p>Now put d<sup>−1/2</sup> = 20 into the fitted line with your constants σ<sub>0</sub> = 100 and k<sub>y</sub> = 10.</p>
   <div class="eq">σ<sub>y</sub> = σ<sub>0</sub> + k<sub>y</sub> · d<sup>−1/2</sup> = 100 + (10)(20)</div>
   <label class="sr-only" for="ansP">Predicted yield strength sigma_y, in megapascals</label>
   <div class="answer-row"><span class="unit">σ<sub>y</sub> =</span><input type="number" id="ansP" step="5" placeholder="?"> <span class="unit">MPa</span><button id="checkP">Check</button></div>
   <div class="feedback" id="fbP" aria-live="polite"></div>
   <div id="hintP"></div>`},
 {html:`<h3>What Hall–Petch buys you</h3>
   <ul class="defs">
     <li>Refining the grains from 0.04 mm to 0.0025 mm lifts the yield strength from <b>150 to 300 MPa</b>, doubled, with no change in composition.</li>
     <li><b>σ<sub>0</sub> = 100 MPa</b> and <b>k<sub>y</sub> = 10 MPa·mm<sup>1/2</sup></b> are constants of this material; measure them once and you can predict σ<sub>y</sub> for any grain size.</li>
     <li>Grain refinement is the one strengthening method that raises strength <b>and</b> toughness at once — which is why it's so widely used.</li>
   </ul>`}
];

// ---------- canvas (720 x 440 coordinate space) ----------
const CW=720, CH=440, PL=70, PR=24, PT=36, PB=56;
const XMAX=22, YMAX=500;
const px=x=>PL+(x/XMAX)*(CW-PL-PR);
const py=s=>CH-PB-(s/YMAX)*(CH-PT-PB);
const ARIA={
 grains:'Illustration comparing a coarse-grained metal (a few large grains with few boundaries) with a fine-grained metal (many small grains with many boundaries); more boundaries block dislocations and raise the yield strength.',
 plot:'Scatter plot of yield strength sigma_y in megapascals versus d to the minus one half in inverse square-root millimeters. Two measured points are shown (coarse at 5, 150 and fine at 10, 200). A fitted straight line, its intercept, and the predicted point for a new sample are added as you work through the steps.'
};

function gbox(ox,oy,w,h,n,seed){
 let s=seed; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
 const pts=[];
 for(let i=0;i<=n;i++){ pts[i]=[]; for(let j=0;j<=n;j++){
   const jx=(i===0||i===n)?0:(rnd()-0.5)*(w/n)*0.55;
   const jy=(j===0||j===n)?0:(rnd()-0.5)*(h/n)*0.55;
   pts[i][j]=[ox+w*i/n+jx, oy+h*j/n+jy]; } }
 ctx.strokeStyle=CSS.steel; ctx.lineWidth=1.8;
 for(let i=0;i<=n;i++){ ctx.beginPath(); for(let j=0;j<=n;j++){ const p=pts[i][j]; if(j===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); } ctx.stroke(); }
 for(let j=0;j<=n;j++){ ctx.beginPath(); for(let i=0;i<=n;i++){ const p=pts[i][j]; if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); } ctx.stroke(); }
 ctx.strokeStyle=CSS.slate; ctx.lineWidth=2; ctx.strokeRect(ox,oy,w,h);
}
function drawGrains(){
 ctx.fillStyle=CSS.mut; ctx.font='15px Calibri'; ctx.textAlign='center';
 ctx.fillText('grain boundaries block dislocations — more boundaries mean a stronger metal',CW/2,26);
 gbox(70,66,250,182,2,7);
 gbox(400,66,250,182,5,37);
 ctx.fillStyle=CSS.navy; ctx.font='bold 16px Cambria'; ctx.textAlign='center';
 ctx.fillText('coarse grains (large d)',195,276);
 ctx.fillText('fine grains (small d)',525,276);
 ctx.fillStyle=CSS.slate; ctx.font='14px Calibri';
 ctx.fillText('few boundaries → weaker',195,300);
 ctx.fillText('many boundaries → stronger',525,300);
 ctx.fillStyle=CSS.terra; ctx.font='bold 15px Calibri';
 ctx.fillText('lower σ_y',195,322); ctx.fillText('higher σ_y',525,322);
}
function drawPlot(){
 ctx.fillStyle=CSS.mut; ctx.font='15px Calibri'; ctx.textAlign='center';
 ctx.fillText('yield strength vs.  d^(−1/2)',CW/2,24);
 // axes
 ctx.strokeStyle=CSS.slate; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(PL,PT); ctx.lineTo(PL,CH-PB); ctx.lineTo(CW-PR,CH-PB); ctx.stroke();
 ctx.font='13.5px Calibri'; ctx.fillStyle=CSS.mut; ctx.textAlign='right';
 for(let s=0;s<=500;s+=100){ const y=py(s); ctx.fillText(s,PL-8,y+4); ctx.strokeStyle='#eef2f7'; ctx.beginPath(); ctx.moveTo(PL,y); ctx.lineTo(CW-PR,y); ctx.stroke(); }
 ctx.textAlign='center'; ctx.fillStyle=CSS.mut;
 for(let x=0;x<=20;x+=5){ ctx.fillText(x,px(x),CH-PB+19); }
 ctx.fillStyle=CSS.slate; ctx.font='15px Calibri'; ctx.fillText('d^(−1/2)   (mm^(−1/2))',CW/2,CH-8);
 ctx.save(); ctx.translate(16,(PT+CH-PB)/2); ctx.rotate(-Math.PI/2); ctx.fillText('yield strength  σ_y  (MPa)',0,0); ctx.restore();
 // fitted line (line itself may show from stage 3; intercept marker + label withheld until σ_0 is solved)
 if(stage>=3){ ctx.strokeStyle=CSS.steel; ctx.lineWidth=2.4; ctx.setLineDash([]); ctx.beginPath();
   ctx.moveTo(px(0),py(S0)); ctx.lineTo(px(XMAX),py(S0+KY*XMAX)); ctx.stroke();
   // intercept marker — don't reveal the intercept the student is being asked for
   if(solved.S){ ctx.fillStyle=CSS.teal; ctx.beginPath(); ctx.arc(px(0),py(S0),6,0,2*Math.PI); ctx.fill();
     ctx.fillStyle=CSS.teal; ctx.font='bold 14px Calibri'; ctx.textAlign='left'; ctx.fillText('σ_0 (intercept)',px(0)+10,py(S0)+22); }
 }
 // slope triangle (step 2)
 if(stage===2){
   ctx.strokeStyle=CSS.amber; ctx.lineWidth=2; ctx.setLineDash([5,3]);
   ctx.beginPath(); ctx.moveTo(px(A[0]),py(A[1])); ctx.lineTo(px(B[0]),py(A[1])); ctx.lineTo(px(B[0]),py(B[1])); ctx.stroke(); ctx.setLineDash([]);
   ctx.fillStyle=CSS.amber; ctx.font='bold 14px Calibri'; ctx.textAlign='center';
   ctx.fillText('Δ(d^−1/2) = 5',(px(A[0])+px(B[0]))/2,py(A[1])+24);
   ctx.textAlign='left'; ctx.fillText('Δσ_y = 50 MPa',px(B[0])+12,(py(A[1])+py(B[1]))/2);
 }
 // data points (given data)
 if(stage>=1){ [ [A,'coarse'],[B,'fine'] ].forEach(([p,lab])=>{
   ctx.fillStyle=CSS.terra; ctx.beginPath(); ctx.arc(px(p[0]),py(p[1]),7,0,2*Math.PI); ctx.fill();
   ctx.fillStyle=CSS.navy; ctx.font='bold 13.5px Calibri'; ctx.textAlign='right'; ctx.fillText(lab,px(p[0])-12,py(p[1])+5); }); }
 // prediction — new-sample marker + value withheld until the d^-1/2 step is solved
 if(solved.X){ ctx.strokeStyle=CSS.purp; ctx.lineWidth=1.8; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(px(PRED_X),CH-PB); ctx.lineTo(px(PRED_X),py(PRED_S)); ctx.stroke(); ctx.setLineDash([]);
   ctx.fillStyle=CSS.purp; ctx.font='bold 14px Calibri'; ctx.textAlign='center'; ctx.fillText('new sample: d^−1/2 = 20',px(PRED_X),CH-PB+38); }
 // predicted point + value withheld until the σ_y step is solved
 if(solved.P){ ctx.fillStyle=CSS.purp; ctx.beginPath(); ctx.arc(px(PRED_X),py(PRED_S),7,0,2*Math.PI); ctx.fill();
   ctx.fillStyle=CSS.purp; ctx.font='bold 15px Calibri'; ctx.textAlign='right'; ctx.fillText('predicted σ_y = 300',px(PRED_X)-12,py(PRED_S)+5); }
}

function updateCaption(){
 const capt=document.getElementById('capt'); if(!capt) return;
 if(stage===0){ capt.innerHTML='Grain boundaries block dislocations: a coarse-grained metal has few boundaries and lower strength; a fine-grained metal has many boundaries and higher strength.'; cv.setAttribute('aria-label',ARIA.grains); return; }
 let msg='Yield strength &sigma;<sub>y</sub> rises linearly with d<sup>−1/2</sup>; the two measured points (coarse and fine) anchor the fit.';
 if(stage>=3) msg+=' The fitted Hall–Petch line is drawn'+(solved.S?', with its intercept &sigma;<sub>0</sub> marked.':'.');
 if(solved.P) msg+=' The new sample’s predicted &sigma;<sub>y</sub> is marked on the line.';
 capt.innerHTML=msg; cv.setAttribute('aria-label',ARIA.plot);
}

function draw(){
 const dpr=window.devicePixelRatio||1, cssW=cv.clientWidth||720;
 cv.width=cssW*dpr; cv.height=cssW*(CH/CW)*dpr; ctx.setTransform((cssW/CW)*dpr,0,0,(cssW/CW)*dpr,0,0);
 ctx.clearRect(0,0,CW,CH);
 if(stage===0) drawGrains(); else drawPlot();
 updateCaption();
}

function render(){
 document.getElementById('stepLabel').textContent=`Step ${stage+1} of ${stages.length}`;
 document.getElementById('card').innerHTML=stages[stage].html;
 const key=stageKey(stage);
 const gated=(key!==null) && !(solved[key]||revealed[key]);
 let nav=`<div class="nav"><button class="ghost" id="back" ${stage===0?'disabled':''}>← Back</button>`;
 if(stage<stages.length-1) nav+=`<button id="next" ${gated?'disabled':''}>Next →</button>`;
 else nav+=`<button id="again" class="ghost">↺ Start over</button>`;
 nav+=`</div>`;
 document.getElementById('card').insertAdjacentHTML('beforeend',nav);
 let dh=''; for(let i=0;i<stages.length;i++) dh+=`<div class="dot ${i===stage?'on':''}"></div>`;
 document.getElementById('dots').innerHTML=dh;
 const back=document.getElementById('back'); if(back) back.onclick=()=>{stage=Math.max(0,stage-1);render();};
 const next=document.getElementById('next'); if(next) next.onclick=()=>{stage=Math.min(stages.length-1,stage+1);render();};
 const again=document.getElementById('again'); if(again) again.onclick=()=>{ stage=0; answers={K:'',S:'',X:'',P:''}; feedback={K:null,S:null,X:null,P:null}; attempts={K:0,S:0,X:0,P:0}; revealed={K:false,S:false,X:false,P:false}; solved={K:false,S:false,X:false,P:false}; render(); };
 wire('checkK',checkK); wire('checkS',checkS); wire('checkX',checkX); wire('checkP',checkP);
 // restore per-step state
 if(key){
   const inp=document.getElementById('ans'+key);
   if(inp){ inp.value=answers[key]||''; inp.oninput=()=>{ answers[key]=inp.value; }; inp.onkeydown=(e)=>{ if(e.key==='Enter'){ ({K:checkK,S:checkS,X:checkX,P:checkP})[key](); } }; }
   applyStepState(key);
 }
 draw();
}
function wire(id,fn){ const b=document.getElementById(id); if(b) b.onclick=fn; }
function updateNext(){ const key=stageKey(stage); const nx=document.getElementById('next'); if(!nx||!key) return; nx.disabled=!(solved[key]||revealed[key]); }
function applyStepState(key){
 const fb=document.getElementById('fb'+key);
 if(fb){ const f=feedback[key]; if(f){ fb.className='feedback '+f.cls; fb.innerHTML=f.html; } else { fb.className='feedback'; fb.innerHTML=''; } }
 const hint=document.getElementById('hint'+key);
 if(hint){
   if(revealed[key]){ hint.innerHTML='<div class="solution"><b>Worked solution:</b> '+solText[key]+'</div>'; }
   else if(attempts[key]>=2 && !solved[key]){
     hint.innerHTML='<div style="margin-top:10px"><button class="ghost" id="show'+key+'">Show the working</button></div>';
     const b=document.getElementById('show'+key); if(b) b.onclick=()=>{ revealed[key]=true; applyStepState(key); };
   } else hint.innerHTML='';
 }
 updateNext();
}
const near=(v,t,tol)=>Math.abs(v-t)<tol;

function checkK(){ const raw=document.getElementById('ansK').value; answers.K=raw; const v=parseFloat(raw);
 if(isNaN(v)){ feedback.K={cls:'no',html:'Enter a number.'}; applyStepState('K'); return; }
 if(near(v,10,1)){ solved.K=true; feedback.K={cls:'ok',html:'✓ Correct — (200−150)/(10−5) = 50/5 = <b>10 MPa·mm^(1/2)</b>. Click Next.'}; }
 else { attempts.K++;
   if(near(v,0.1,0.05)) feedback.K={cls:'no',html:'You inverted it. Slope = rise/run = Δσ_y / Δ(d^−1/2), not the other way around.'};
   else if(near(v,20,2)||near(v,30,2)) feedback.K={cls:'no',html:'That\'s σ_y/d^−1/2 at one point. Slope uses the <b>change</b> between the two points.'};
   else feedback.K={cls:'no',html:'Not quite. k_y = (200−150)/(10−5) = 10.'};
 }
 applyStepState('K'); draw(); }

function checkS(){ const raw=document.getElementById('ansS').value; answers.S=raw; const v=parseFloat(raw);
 if(isNaN(v)){ feedback.S={cls:'no',html:'Enter a number (MPa).'}; applyStepState('S'); return; }
 if(near(v,100,6)){ solved.S=true; feedback.S={cls:'ok',html:'✓ Correct — 150 − (10)(5) = <b>100 MPa</b>. Click Next.'}; }
 else { attempts.S++;
   if(near(v,200,10)) feedback.S={cls:'no',html:'You added instead of subtracting. σ_0 = σ_y − k_y·d^−1/2 = 150 − 50.'};
   else if(near(v,150,8)||near(v,200,8)) feedback.S={cls:'no',html:'That\'s a measured σ_y. σ_0 is the intercept — subtract the k_y·d^−1/2 term.'};
   else feedback.S={cls:'no',html:'Not quite. σ_0 = 150 − (10)(5) = 100 MPa.'};
 }
 applyStepState('S'); draw(); }

function checkX(){ const raw=document.getElementById('ansX').value; answers.X=raw; const v=parseFloat(raw);
 if(isNaN(v)){ feedback.X={cls:'no',html:'Enter a number.'}; applyStepState('X'); return; }
 if(near(v,20,1)){ solved.X=true; feedback.X={cls:'ok',html:'✓ Correct — 1/√0.0025 = 1/0.05 = <b>20 mm^(−1/2)</b>. Click Next.'}; }
 else { attempts.X++;
   if(near(v,0.05,0.02)) feedback.X={cls:'no',html:'That\'s √d. You need <b>1 over</b> that: 1/0.05 = 20.'};
   else if(near(v,400,20)) feedback.X={cls:'no',html:'That\'s 1/d. You need 1/√d — take the square root first: √0.0025 = 0.05.'};
   else feedback.X={cls:'no',html:'Not quite. d^−1/2 = 1/√0.0025 = 1/0.05 = 20.'};
 }
 applyStepState('X'); draw(); }

function checkP(){ const raw=document.getElementById('ansP').value; answers.P=raw; const v=parseFloat(raw);
 if(isNaN(v)){ feedback.P={cls:'no',html:'Enter a number (MPa).'}; applyStepState('P'); return; }
 if(near(v,300,12)){ solved.P=true; feedback.P={cls:'ok',html:'✓ Correct — 100 + (10)(20) = <b>300 MPa</b>. Click Next.'}; }
 else { attempts.P++;
   if(near(v,200,12)) feedback.P={cls:'no',html:'You left out σ_0. Add the intercept: 100 + (10)(20) = 300.'};
   else feedback.P={cls:'no',html:'Not quite. σ_y = 100 + (10)(20) = 300 MPa.'};
 }
 applyStepState('P'); draw(); }

window.addEventListener('resize',draw);
render();
</script>
